<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ title }}{% endblock %} — Culture Wiki</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400&family=Outfit:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{{ root_path }}css/style.css">
</head>

<body>
    <div class="layout">
        <!-- Sidebar Navigation -->
        <nav class="sidebar">
            <div class="sidebar-header">
                <a href="{{ root_path }}index.html" class="logo">
                    <span class="logo-glyph">◈</span>
                    <span class="logo-text">Culture Wiki</span>
                </a>
            </div>

            <div class="sidebar-search">
                <input type="text" id="search-input" placeholder="Search articles..." autocomplete="off">
            </div>

            <ul class="nav-sections">
                <li class="nav-section">
                    <a href="{{ root_path }}characters/index.html" class="nav-section-header">
                        <span class="nav-icon">●</span> Characters
                    </a>
                </li>
                <li class="nav-section">
                    <a href="{{ root_path }}ships_and_minds/index.html" class="nav-section-header">
                        <span class="nav-icon">◆</span> Ships & Minds
                    </a>
                </li>
                <li class="nav-section">
                    <a href="{{ root_path }}locations/index.html" class="nav-section-header">
                        <span class="nav-icon">◐</span> Locations
                    </a>
                </li>
                <li class="nav-section">
                    <a href="{{ root_path }}technology/index.html" class="nav-section-header">
                        <span class="nav-icon">⬡</span> Technology
                    </a>
                </li>
                <li class="nav-section">
                    <a href="{{ root_path }}factions/index.html" class="nav-section-header">
                        <span class="nav-icon">◧</span> Factions
                    </a>
                </li>
                <li class="nav-section">
                    <a href="{{ root_path }}events/index.html" class="nav-section-header">
                        <span class="nav-icon">◈</span> Events
                    </a>
                </li>
            </ul>

            <div class="sidebar-footer">
                <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
                    <span class="theme-icon-light">☀</span>
                    <span class="theme-icon-dark">☾</span>
                </button>
                <span class="sidebar-meta">Generated by LLM</span>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="content">
            {% block content %}{% endblock %}
        </main>

        <!-- Citation Tooltip (injected by JS) -->
        <div id="citation-tooltip" class="citation-tooltip" role="tooltip" aria-hidden="true">
            <div class="citation-tooltip-header">
                <span class="citation-book"></span>
                <button class="citation-close" aria-label="Close">×</button>
            </div>
            <blockquote class="citation-quote"></blockquote>
        </div>
    </div>

    <!-- Citation data will be injected here per-page -->
    {% block citations_data %}{% endblock %}

    <script src="{{ root_path }}js/citations.js"></script>
    <script src="{{ root_path }}js/search.js"></script>
    {% block scripts %}{% endblock %}
</body>

</html>
